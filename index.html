<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A9D8F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adventure">
<meta name="referrer" content="no-referrer">
<title>World Adventure</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-version="v33" data-built="03 Nov 2026">

<header class="top" id="top">
  <div class="brand"><span class="logo" aria-hidden="true">🌏</span><span class="stamp">World Adventure<span class="edition" id="top-edition"> · Family</span></span></div>
  <div class="top-actions">
    <button class="icon-btn pts" id="btn-points" title="Quests" aria-label="Quests and points"><span id="top-face"></span><span id="top-points">⭐</span></button>
    <button class="icon-btn sos" id="btn-sos" title="SOS" aria-label="SOS: lost kid or emergency">SOS</button>
    <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">⚙</button>
  </div>
</header>

<div id="banner" class="banner hidden"></div>

<main id="main">
  <!-- Unlock / setup -->
  <section id="screen-unlock" class="screen">
    <div class="card centre unlock">
      <div class="unlock-emoji" aria-hidden="true">🌏</div>
      <h1 class="h1">World Adventure</h1>
      <p class="muted" id="unlock-sub">Loading…</p>
      <form id="form-passphrase" class="hidden" autocomplete="off">
        <label class="label" for="pp">Family passphrase (first time on this device)</label>
        <input id="pp" type="password" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" class="input" required>
        <button class="btn primary" type="submit">Unlock</button>
        <p class="tiny muted">Typed once per device. After this, the 4-digit PIN.</p>
      </form>
      <form id="form-setpin" class="hidden" autocomplete="off">
        <label class="label" for="pin1">Choose a 4-digit PIN for this device</label>
        <input id="pin1" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" class="input pin" required>
        <label class="label" for="pin2">Again</label>
        <input id="pin2" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" class="input pin" required>
        <button class="btn primary" type="submit">Save PIN</button>
      </form>
      <form id="form-pin" class="hidden" autocomplete="off">
        <label class="label" for="pin">PIN</label>
        <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" class="input pin" required autofocus>
        <button class="btn primary" type="submit">Open</button>
        <p class="tiny muted" id="pin-hint"></p>
      </form>
      <p class="error hidden" id="unlock-error"></p>
    </div>
  </section>

  <section id="screen-home" class="screen hidden"></section>
  <section id="screen-quests" class="screen hidden"></section>
  <section id="screen-passport" class="screen hidden"></section>
  <section id="screen-book" class="screen hidden"></section>
  <section id="screen-gates" class="screen hidden"></section>
  <section id="screen-days" class="screen hidden"></section>
  <section id="screen-moves" class="screen hidden"></section>
  <section id="screen-stays" class="screen hidden"></section>
  <section id="screen-map" class="screen hidden"></section>
  <section id="screen-where" class="screen hidden"></section>
  <section id="screen-taxi" class="screen hidden"></section>
  <section id="screen-sos" class="screen hidden"></section>
  <section id="screen-protocols" class="screen hidden"></section>
  <section id="screen-vault" class="screen hidden"></section>
  <section id="screen-settings" class="screen hidden"></section>
  <section id="screen-story" class="screen hidden"></section>
</main>

<nav id="nav" class="nav hidden" aria-label="Sections">
  <button data-screen="home"><span class="ico">🏠</span><span>Home</span></button>
  <button data-screen="map"><span class="ico">🗺️</span><span>Map</span></button>
  <button data-screen="quests"><span class="ico">🏆</span><span>Quests</span><span class="nbadge hidden" id="nav-quests-badge"></span></button>
  <button data-screen="story"><span class="ico">📖</span><span>Stories</span><span class="nbadge hidden" id="nav-stories-badge"></span></button>
  <button data-screen="where"><span class="ico">🌏</span><span>Where</span></button>
  <button data-screen="book"><span class="ico">📚</span><span>Book</span></button>
</nav>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-inner" id="modal-inner"></div>
</div>

<div id="party" class="party hidden" aria-live="polite"></div>
<div id="levelup" class="levelup hidden" aria-live="polite"></div>
<div id="overlay" class="overlay hidden"></div>
<input id="pick-camera" type="file" accept="image/*" capture="environment" class="vhidden" tabindex="-1" aria-hidden="true">
<input id="pick-library" type="file" accept="image/*" multiple class="vhidden" tabindex="-1" aria-hidden="true">

<script src="vendor/pmtiles.js"></script>
<script src="fx.js"></script>
<script src="sync.js"></script>
<script src="media.js"></script>
<script src="quests.js"></script>
<script src="journal.js"></script>
<script src="postcard.js"></script>
<script src="app.js"></script>
<script type="module" src="map.js"></script>
<script type="module" src="globe.js"></script>
</body>
</html>
